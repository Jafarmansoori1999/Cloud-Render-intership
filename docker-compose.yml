version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: fullstack-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fullstack-app
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    networks:
      - fullstack-network

  # Node.js Backend Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fullstack-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/fullstack-app?authSource=admin
      FRONTEND_URL: http://localhost:5173
      API_VERSION: v1
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - fullstack-network
    command: npm run dev

  # React Frontend (for development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fullstack-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_API_VERSION: v1
      VITE_APP_NAME: Full-Stack App
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - fullstack-network
    command: npm run dev

volumes:
  mongodb_data:
  mongodb_config:

networks:
  fullstack-network:
    driver: bridge

# Usage:
# docker-compose up          # Start all services
# docker-compose down        # Stop all services
# docker-compose logs -f     # View logs
# docker-compose ps          # Show running services
